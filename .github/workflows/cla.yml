name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    if: "(github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'"
    runs-on: "ubuntu-latest"
    steps:
      # GitHub App token for writing signatures to semanticdatalayer/sml-cla (replaces an expiring user PAT)
      - name: "Get app token"
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: "${{ secrets.SEMANTIC_AUTOMATE_CLIENT_ID }}"
          private-key: "${{ secrets.SEMANTIC_AUTOMATE_CLIENT_SECRET }}"
          owner: "semanticdatalayer"
          repositories: "sml-cla"
      - name: "CLA Assistant"
        uses: contributor-assistant/github-action@v2.5.1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PERSONAL_ACCESS_TOKEN: "${{ steps.app-token.outputs.token }}"
        with:
          remote-organization-name: "semanticdatalayer"
          remote-repository-name: "sml-cla"
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/semanticdatalayer/SML/blob/main/CLA.md"
          branch: "main"
          allowlist: "dependabot[bot],greenkeeper[bot]"